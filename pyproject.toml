[project]
name = "fpl-value-model"
version = "0.1.0"
description = "Predict what an FPL player's price should be and flag market mispricing."
authors = [
    {name = "Sepanta Ganjei",email = "sepantaganjei@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "joblib (>=1.4.0,<2.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pyarrow (>=25.0.0,<26.0.0)",
    "streamlit (>=1.40.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "fpl_value_model", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyterlab (>=4.6.1,<5.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=6.0.0,<7.0.0)",
    "ruff (>=0.15.21,<0.16.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pandas-stubs (>=2.2.0,<3.0.0)",
    "types-requests (>=2.32.0,<3.0.0)"
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D", "ANN", "SIM", "PTH"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = []

[[tool.mypy.overrides]]
module = ["sklearn.*", "matplotlib.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=fpl_value_model --cov-report=term-missing"
